[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-system-games"
version = "0.1.0"
description = "Classical values and perfect quantum strategies for linear system nonlocal games, simulated with Qiskit."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tiasa Mondol", email = "tmondol@uwaterloo.ca" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "qiskit>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lsgames = "lsgames.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
